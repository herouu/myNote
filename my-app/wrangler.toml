name = "mynote-api"
main = "src/workers/index.ts"
compatibility_date = "2024-01-01"

# D1 数据库绑定
[[d1_databases]]
binding = "DB"  # Workers 中通过 env.DB 访问
database_name = "mynote-db"
database_id = "YOUR_DATABASE_ID"  # 需要在 Cloudflare Dashboard 创建 D1 数据库后填入

# KV 命名空间绑定（可选）
# [[kv_namespaces]]
# binding = "CACHE"
# id = "YOUR_KV_ID"

# 开发环境配置
[env.production]
name = "mynote-api"
route = "api.yourdomain.com/*"  # 生产环境路由

[dev]
port = 8787
local_protocol = "http"
